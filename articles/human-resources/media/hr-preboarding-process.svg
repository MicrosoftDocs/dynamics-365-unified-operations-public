<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">How preboarding works</title>
  <desc id="desc">Seven steps: create the candidate, invite, the candidate completes the steps, the candidate submits with consent, HR reviews, the pre-employment check, and ready to onboard. If HR requests rework, the candidate updates the reopened steps and submits again.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker></defs>
  <rect width="1600" height="450" fill="#FFFFFF"/>
  <text x="800" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#242424">How preboarding works</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="45" y="70" width="190" height="230" rx="10" fill="#F5F0FA" stroke="#5C2E91" stroke-width="2"/>
    <rect x="45" y="70" width="190" height="36" rx="10" fill="#5C2E91"/>
    <rect x="45" y="96" width="190" height="10" fill="#5C2E91"/>
    <text x="140" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Recruiter or HR</text>
    <circle cx="140" cy="136" r="18" fill="#FFFFFF" stroke="#5C2E91" stroke-width="2"/>
    <text x="140" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#5C2E91">1</text>
    <text x="140" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Create candidate</text>
    <text x="140" y="204" text-anchor="middle" font-size="13" fill="#424242">Applicant set to Ready</text>
    <text x="140" y="222" text-anchor="middle" font-size="13" fill="#424242">to hire in the Recruiting</text>
    <text x="140" y="240" text-anchor="middle" font-size="13" fill="#424242">app, or HR creates the</text>
    <text x="140" y="258" text-anchor="middle" font-size="13" fill="#424242">candidate in Human</text>
    <text x="140" y="276" text-anchor="middle" font-size="13" fill="#424242">Resources.</text>
  </g>
  <line x1="238" y1="185" x2="262" y2="185" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="265" y="70" width="190" height="230" rx="10" fill="#EBF3FC" stroke="#0F6CBD" stroke-width="2"/>
    <rect x="265" y="70" width="190" height="36" rx="10" fill="#0F6CBD"/>
    <rect x="265" y="96" width="190" height="10" fill="#0F6CBD"/>
    <text x="360" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">HR</text>
    <circle cx="360" cy="136" r="18" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="2"/>
    <text x="360" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0F6CBD">2</text>
    <text x="360" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Invite</text>
    <text x="360" y="204" text-anchor="middle" font-size="13" fill="#424242">HR selects Initiate on</text>
    <text x="360" y="222" text-anchor="middle" font-size="13" fill="#424242">Candidates (preview).</text>
    <text x="360" y="240" text-anchor="middle" font-size="13" fill="#424242">The candidate receives</text>
    <text x="360" y="258" text-anchor="middle" font-size="13" fill="#424242">an invitation email.</text>
  </g>
  <line x1="458" y1="185" x2="482" y2="185" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="485" y="70" width="190" height="230" rx="10" fill="#F1FAF1" stroke="#107C10" stroke-width="2"/>
    <rect x="485" y="70" width="190" height="36" rx="10" fill="#107C10"/>
    <rect x="485" y="96" width="190" height="10" fill="#107C10"/>
    <text x="580" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Candidate</text>
    <circle cx="580" cy="136" r="18" fill="#FFFFFF" stroke="#107C10" stroke-width="2"/>
    <text x="580" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#107C10">3</text>
    <text x="580" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Complete steps</text>
    <text x="580" y="204" text-anchor="middle" font-size="13" fill="#424242">The candidate signs in</text>
    <text x="580" y="222" text-anchor="middle" font-size="13" fill="#424242">to the careers site and</text>
    <text x="580" y="240" text-anchor="middle" font-size="13" fill="#424242">completes the</text>
    <text x="580" y="258" text-anchor="middle" font-size="13" fill="#424242">preboarding steps.</text>
  </g>
  <line x1="678" y1="185" x2="702" y2="185" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="705" y="70" width="190" height="230" rx="10" fill="#F1FAF1" stroke="#107C10" stroke-width="2"/>
    <rect x="705" y="70" width="190" height="36" rx="10" fill="#107C10"/>
    <rect x="705" y="96" width="190" height="10" fill="#107C10"/>
    <text x="800" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Candidate</text>
    <circle cx="800" cy="136" r="18" fill="#FFFFFF" stroke="#107C10" stroke-width="2"/>
    <text x="800" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#107C10">4</text>
    <text x="800" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Submit</text>
    <text x="800" y="204" text-anchor="middle" font-size="13" fill="#424242">The candidate reviews</text>
    <text x="800" y="222" text-anchor="middle" font-size="13" fill="#424242">their information,</text>
    <text x="800" y="240" text-anchor="middle" font-size="13" fill="#424242">consents to the pre-</text>
    <text x="800" y="258" text-anchor="middle" font-size="13" fill="#424242">employment check, and</text>
    <text x="800" y="276" text-anchor="middle" font-size="13" fill="#424242">submits.</text>
  </g>
  <line x1="898" y1="185" x2="922" y2="185" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="925" y="70" width="190" height="230" rx="10" fill="#EBF3FC" stroke="#0F6CBD" stroke-width="2"/>
    <rect x="925" y="70" width="190" height="36" rx="10" fill="#0F6CBD"/>
    <rect x="925" y="96" width="190" height="10" fill="#0F6CBD"/>
    <text x="1020" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">HR</text>
    <circle cx="1020" cy="136" r="18" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="2"/>
    <text x="1020" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0F6CBD">5</text>
    <text x="1020" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Review</text>
    <text x="1020" y="204" text-anchor="middle" font-size="13" fill="#424242">HR approves the</text>
    <text x="1020" y="222" text-anchor="middle" font-size="13" fill="#424242">submission, requests</text>
    <text x="1020" y="240" text-anchor="middle" font-size="13" fill="#424242">rework, or disqualifies</text>
    <text x="1020" y="258" text-anchor="middle" font-size="13" fill="#424242">the candidate.</text>
  </g>
  <line x1="1118" y1="185" x2="1142" y2="185" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="1145" y="70" width="190" height="230" rx="10" fill="#EBF3FC" stroke="#0F6CBD" stroke-width="2"/>
    <rect x="1145" y="70" width="190" height="36" rx="10" fill="#0F6CBD"/>
    <rect x="1145" y="96" width="190" height="10" fill="#0F6CBD"/>
    <text x="1240" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">HR</text>
    <circle cx="1240" cy="136" r="18" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="2"/>
    <text x="1240" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0F6CBD">6</text>
    <text x="1240" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Pre-employment check</text>
    <text x="1240" y="204" text-anchor="middle" font-size="13" fill="#424242">HR records the vendor</text>
    <text x="1240" y="222" text-anchor="middle" font-size="13" fill="#424242">and outcome of the</text>
    <text x="1240" y="240" text-anchor="middle" font-size="13" fill="#424242">check, or skips it.</text>
  </g>
  <line x1="1338" y1="185" x2="1362" y2="185" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="1365" y="70" width="190" height="230" rx="10" fill="#EBF3FC" stroke="#0F6CBD" stroke-width="2"/>
    <rect x="1365" y="70" width="190" height="36" rx="10" fill="#0F6CBD"/>
    <rect x="1365" y="96" width="190" height="10" fill="#0F6CBD"/>
    <text x="1460" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">HR</text>
    <circle cx="1460" cy="136" r="18" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="2"/>
    <text x="1460" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0F6CBD">7</text>
    <text x="1460" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">Ready to onboard</text>
    <text x="1460" y="204" text-anchor="middle" font-size="13" fill="#424242">Preboarding and the</text>
    <text x="1460" y="222" text-anchor="middle" font-size="13" fill="#424242">offer are complete.</text>
    <text x="1460" y="240" text-anchor="middle" font-size="13" fill="#424242">HR hires the candidate</text>
    <text x="1460" y="258" text-anchor="middle" font-size="13" fill="#424242">in Human Resources.</text>
  </g>
  <path d="M1020,304 C1020,360 580,360 580,308" fill="none" stroke="#C50F1F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="800" y="366" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#C50F1F">Rework requested: the candidate updates the reopened steps and submits again</text>
  <rect x="45" y="407" width="16" height="16" rx="3" fill="#5C2E91"/>
  <text x="69" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#424242">Recruiter or HR</text>
  <rect x="195" y="407" width="16" height="16" rx="3" fill="#0F6CBD"/>
  <text x="219" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#424242">HR</text>
  <rect x="265" y="407" width="16" height="16" rx="3" fill="#107C10"/>
  <text x="289" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#424242">Candidate</text>
  <text x="1555" y="420" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#424242">At each step, the careers site, Human Resources, and the Recruiting app are kept up to date.</text>
</svg>
